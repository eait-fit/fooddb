name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fooddb
          POSTGRES_PASSWORD: fooddb
          POSTGRES_DB: fooddb__test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fooddb -d fooddb__test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FOODDB__BACKEND__DATABASE_URL: postgresql://fooddb:fooddb@127.0.0.1:5432/fooddb__test
      FOODDB_TEST_DATABASE_URL: postgresql://fooddb:fooddb@127.0.0.1:5432/fooddb__test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run fooddb migrate
      - run: uv run pytest -rs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
