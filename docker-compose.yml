services:
  db:
    image: postgres:18-alpine
    container_name: fooddb-db
    environment:
      POSTGRES_USER: fooddb
      POSTGRES_PASSWORD: fooddb
      POSTGRES_DB: fooddb
    ports:
      - "5440:5432"
    volumes:
      - fooddb-pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fooddb"]
      interval: 2s
      retries: 20
volumes:
  fooddb-pg18:
