# Self-hosted fooddb: Postgres, a one-shot migration, the API and the job worker.
# Runbook: docs/deploy.md. Every setting comes from deploy/.env (see deploy/.env.example).
name: fooddb

x-app: &app
  image: ${FOODDB__DEPLOY__IMAGE:-fooddb:latest}
  build: ..
  restart: unless-stopped
  environment:
    FOODDB__BACKEND__DATABASE_URL: postgresql://fooddb:${FOODDB__BACKEND__POSTGRES_PASSWORD:?set FOODDB__BACKEND__POSTGRES_PASSWORD in deploy/.env}@db:5432/fooddb
    FOODDB__BACKEND__MATCH_THRESHOLD: ${FOODDB__BACKEND__MATCH_THRESHOLD:-0.95}
    FOODDB__BACKEND__SECRET_KEY: ${FOODDB__BACKEND__SECRET_KEY:-}
    FOODDB__BACKEND__REQUIRE_KEY_FOR_READS: ${FOODDB__BACKEND__REQUIRE_KEY_FOR_READS:-false}
    FOODDB__BACKEND__RATE_LIMIT_PER_MINUTE: ${FOODDB__BACKEND__RATE_LIMIT_PER_MINUTE:-60}
    FOODDB__BACKEND__RAPIDAPI_PROXY_SECRET: ${FOODDB__BACKEND__RAPIDAPI_PROXY_SECRET:-}
    FOODDB__BACKEND__PUBLIC_URL: ${FOODDB__BACKEND__PUBLIC_URL:-}
    FOODDB__BACKEND__RESEND_API_KEY: ${FOODDB__BACKEND__RESEND_API_KEY:-}
    FOODDB__BACKEND__MAIL: ${FOODDB__BACKEND__MAIL:-}
    FOODDB__BACKEND__MAIL_FROM: ${FOODDB__BACKEND__MAIL_FROM:-}
    FOODDB__BACKEND__STRIPE_SECRET_KEY: ${FOODDB__BACKEND__STRIPE_SECRET_KEY:-}
    FOODDB__BACKEND__STRIPE_WEBHOOK_SECRET: ${FOODDB__BACKEND__STRIPE_WEBHOOK_SECRET:-}
    FOODDB__BACKEND__STRIPE_PRICE_ID: ${FOODDB__BACKEND__STRIPE_PRICE_ID:-}
    FOODDB__BACKEND__STRIPE_AUTOMATIC_TAX: ${FOODDB__BACKEND__STRIPE_AUTOMATIC_TAX:-false}
    FOODDB__BACKEND__STRIPE_TAX_BEHAVIOR: ${FOODDB__BACKEND__STRIPE_TAX_BEHAVIOR:-inclusive}
    FOODDB__BACKEND__STRIPE_TAX_CODE: ${FOODDB__BACKEND__STRIPE_TAX_CODE:-txcd_10000000}
    FOODDB__BACKEND__CREDITS_PER_PACK: ${FOODDB__BACKEND__CREDITS_PER_PACK:-100000}
    # The API port is published on loopback only, so every peer is the reverse proxy: trust its
    # X-Forwarded-For, or the per-IP rate limit sees one client.
    FOODDB__BACKEND__FORWARDED_ALLOW_IPS: "*"
    FOODDB__BACKEND__STALE_AFTER_DAYS: ${FOODDB__BACKEND__STALE_AFTER_DAYS:-730}
    FOODDB__BACKEND__REQUEST_LOG_DAYS: ${FOODDB__BACKEND__REQUEST_LOG_DAYS:-30}
    FOODDB__BACKEND__DUMP_DIR: /app/dumps
    FOODDB__BACKEND__DUMP_KEEP: ${FOODDB__BACKEND__DUMP_KEEP:-3}
    FOODDB__BACKEND__PHOTO_DIR: /app/photos
    FOODDB__BACKEND__LLM_API_KEY: ${FOODDB__BACKEND__LLM_API_KEY:-}
    FOODDB__BACKEND__LLM_MODEL: ${FOODDB__BACKEND__LLM_MODEL:-}
    FOODDB__BACKEND__LABEL_READER: ${FOODDB__BACKEND__LABEL_READER:-}
    FOODDB__BACKEND__LABEL_CONFIDENCE_FLOOR: ${FOODDB__BACKEND__LABEL_CONFIDENCE_FLOOR:-0.9}
    FOODDB__BACKEND__FETCH_FDC_BRANDED: ${FOODDB__BACKEND__FETCH_FDC_BRANDED:-false}
    FOODDB__BACKEND__FETCH_FINELI: ${FOODDB__BACKEND__FETCH_FINELI:-false}
    FOODDB__BACKEND__FINELI_URL: ${FOODDB__BACKEND__FINELI_URL:-https://fineli.fi/fineli/content/file/47}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fooddb
      POSTGRES_DB: fooddb
      POSTGRES_PASSWORD: ${FOODDB__BACKEND__POSTGRES_PASSWORD:?set FOODDB__BACKEND__POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fooddb"]
      interval: 5s
      retries: 30

  # Runs fooddb's and pq's migrations, then exits. The API and worker start only after it succeeds.
  migrate:
    <<: *app
    restart: "no"
    command: ["fooddb", "migrate"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    command: ["fooddb", "serve"]
    volumes:
      - dumps:/app/dumps:ro  # serves the monthly ODbL dumps the worker writes
      - photos:/app/photos  # label photos uploaded to POST /v1/labels
    ports:
      # Loopback only: put a TLS reverse proxy (Caddy, nginx) in front. See docs/deploy.md.
      - "${FOODDB__DEPLOY__BIND:-127.0.0.1}:${FOODDB__DEPLOY__PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["fooddb", "worker"]
    healthcheck: { disable: true }
    volumes:
      - dumps:/app/dumps
      - photos:/app/photos:ro  # reads the label photos the API stores
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata18:
  dumps:
  photos:
